services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?請先複製 .env.example 成 .env 並填入}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請先複製 .env.example 成 .env 並填入}
      POSTGRES_DB: ${POSTGRES_DB:?請先複製 .env.example 成 .env 並填入}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 本機開發用，允許匿名連線。部署到雲端時必須啟用帳密（見 design.md Risks）。
  mosquitto:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "${MQTT_PORT:-1883}:1883"

volumes:
  postgres_data:
