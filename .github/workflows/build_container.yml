name: Build and Push Containers

# 當 push 到 feature/deploy 分支時，打包 frontend/backend container
# 並推送到 GitHub Container Registry (ghcr.io)
#
# Image: ghcr.io/gae265/tabletop-hub-tw-backend:latest
#         ghcr.io/gae265/tabletop-hub-tw-backend:<sha>
#         ghcr.io/gae265/tabletop-hub-tw-frontend:latest
#         ghcr.io/gae265/tabletop-hub-tw-frontend:<sha>
#
# 部署時用 -e 傳入環境變數，不寫死在 image 裡。

on:
  push:
    branches: [feature/deploy]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/gae265/tabletop-hub-tw-backend
  FRONTEND_IMAGE: ghcr.io/gae265/tabletop-hub-tw-frontend
  FRONTEND_DEV_IMAGE: ghcr.io/gae265/tabletop-hub-tw-frontend-dev

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend_dev
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest_dev
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}_dev
          cache-from: type=gha
          cache-to: type=gha,mode=max