name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]


jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'

    steps:
      # 1. 使用你設定好的 Secret 登入 GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. 更新第一個 Cloud Run 服務 (例如 frontend)
      - name: Deploy Frontend Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: tabletop-hub-tw-frontend
          region: us-east1
          image: us-east1-docker.pkg.dev/aerial-handbook-256212/tabletop-hub-tw-repo/gae265/tabletop-hub-tw-frontend:${{ github.event.workflow_run.head_sha }}

      - name: Deploy Frontend DEV Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: tabletop-hub-tw-frontend-dev
          region: us-east1
          image: us-east1-docker.pkg.dev/aerial-handbook-256212/tabletop-hub-tw-repo/gae265/tabletop-hub-tw-frontend-dev:${{ github.event.workflow_run.head_sha }}

      # 3. 更新第二個 Cloud Run 服務 (例如 backend 或其他服務)
      - name: Deploy Backend Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: tabletop-hub-tw-backend # 替換為你的第 2 個 Cloud Run 服務名稱
          region: us-east1                  # 替換為該服務所在的 region
          image: us-east1-docker.pkg.dev/aerial-handbook-256212/tabletop-hub-tw-repo/gae265/tabletop-hub-tw-backend:${{ github.event.workflow_run.head_sha }}
      # 4. 部署成功後才觸發 E2E（前面任一部署步驟失敗，此步驟會被跳過）。
      #    只送出請求（202）就繼續，不等測試跑完；結果由 E2E server 另外發 Discord 通知。
      #    continue-on-error：E2E 觸發失敗不應讓「部署成功」變成「部署失敗」，改在通知中標示。
      - name: Trigger E2E tests
        id: e2e
        continue-on-error: true
        env:
          E2E_URL: ${{ secrets.E2E_URL }}
          E2E_API_TOKEN: ${{ secrets.E2E_API_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          IDEM: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          RESP=$(curl -fsS --retry 3 --retry-all-errors -X POST "$E2E_URL/api/v1/test-runs" \
            -H "Authorization: Bearer $E2E_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"project\":\"tabletop-hub-tw\",\"git_sha\":\"$SHA\",\"backend_tag\":\"$SHA\",\"frontend_tag\":\"$SHA\",\"idempotency_key\":\"$IDEM\"}")
          echo "$RESP"
          echo "run_id=$(jq -r .run_id <<<"$RESP")" >> "$GITHUB_OUTPUT"

      - name: Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_RUN_ID: ${{ steps.e2e.outputs.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="✅ 部署成功"
          else
            STATUS="❌ 部署失敗"
          fi

          case "$E2E_OUTCOME" in
            success) E2E_LINE="E2E run_id: $E2E_RUN_ID（測試結果將另行通知）" ;;
            failure) E2E_LINE="E2E: ⚠️ 觸發失敗，請檢查 E2E server" ;;
            *)       E2E_LINE="E2E: 未觸發（部署未完成）" ;;
          esac

          MESSAGE="$STATUS
          Repository: $REPO
          Branch: $BRANCH
          Commit: ${COMMIT:0:7}
          Triggered by: $ACTOR
          $E2E_LINE"

          jq -n --arg content "$MESSAGE" \
            '{content: $content}' |
            curl -sS -H "Content-Type: application/json" \
            -d @- "$DISCORD_WEBHOOK"
