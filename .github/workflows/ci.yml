name: CI

# 發 MR 到 dev 或 main 時執行。各 job 互相獨立，一個失敗不影響其他。
on:
  push:
    branches: [feature/log_anaylaze]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/gae265/tabletop-hub-tw-backend
  FRONTEND_IMAGE: ghcr.io/gae265/tabletop-hub-tw-frontend
  FRONTEND_DEV_IMAGE: ghcr.io/gae265/tabletop-hub-tw-frontend-dev

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        # 僅限 CI 使用的測試帳密，不是秘密
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      AUTH_MODE: dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 1. 使用你設定好的 Secret 登入 GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      # 3. 更新第二個 Cloud Run 服務 (例如 backend 或其他服務)
      - name: Deploy Backend Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: tabletop-hub-tw-backend-log # 替換為你的第 2 個 Cloud Run 服務名稱
          region: us-east1                  # 替換為該服務所在的 region
          image: us-east1-docker.pkg.dev/aerial-handbook-256212/tabletop-hub-tw-repo/gae265/tabletop-hub-tw-backend-log:${{ github.event.workflow_run.head_sha }}
          labels: |
            commit-sha=${{ github.event.workflow_run.head_sha }}